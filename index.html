<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR 코드 생성기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A1B1C;
    --bg-elev:#232425;
    --fg:#F4F3F0;
    --fg-soft:#9A9C9E;
    --fg-faint:#57595B;
    --line:#F4F3F0;
    --radius:2px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  .page{
    max-width:1040px;
    margin:0 auto;
    padding:64px 24px 90px;
  }

  /* ---- hero ---- */
  header.hero{
    margin-bottom:64px;
  }
  .spec-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:36px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--fg-faint);
  }
  .headline{
    font-family:'Archivo Black', sans-serif;
    font-size:clamp(52px, 10vw, 108px);
    line-height:0.92;
    letter-spacing:-0.01em;
    margin:0;
    opacity:0;
    transform:translateY(18px);
    animation:fadeUp 0.7s cubic-bezier(.22,.68,.32,1) 0.05s forwards;
  }
  .bar{
    width:0;
    height:10px;
    background:var(--line);
    margin:22px 0 22px;
    animation:growBar 0.6s cubic-bezier(.22,.68,.32,1) 0.55s forwards;
  }
  .tagline{
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.28em;
    color:var(--fg-soft);
    margin:0;
    opacity:0;
    animation:fadeUp 0.6s cubic-bezier(.22,.68,.32,1) 0.75s forwards;
  }
  @keyframes fadeUp{
    to{opacity:1; transform:translateY(0);}
  }
  @keyframes growBar{
    to{width:132px;}
  }
  @media (prefers-reduced-motion: reduce){
    .headline, .bar, .tagline{animation:none; opacity:1; width:132px; transform:none;}
  }

  /* ---- workspace ---- */
  main.workspace{
    display:grid;
    grid-template-columns:1fr 380px;
    gap:1px;
    background:var(--fg-faint);
    border:1px solid var(--fg-faint);
  }
  @media (max-width:760px){
    main.workspace{grid-template-columns:1fr;}
  }
  .controls, .proof-wrap{
    background:var(--bg);
    padding:40px;
  }

  .field{margin-bottom:30px;}
  .field:last-child{margin-bottom:0;}
  label{
    display:block;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.04em;
    color:var(--fg-soft);
    margin-bottom:10px;
  }
  textarea, select{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:15px;
    color:var(--fg);
    background:var(--bg-elev);
    border:1px solid var(--fg-faint);
    border-radius:var(--radius);
    padding:13px 15px;
    resize:vertical;
    min-height:78px;
  }
  select{
    min-height:auto;
    height:46px;
    appearance:none;
    background-image:linear-gradient(45deg, transparent 50%, var(--fg) 50%), linear-gradient(135deg, var(--fg) 50%, transparent 50%);
    background-position:calc(100% - 20px) center, calc(100% - 15px) center;
    background-size:5px 5px, 5px 5px;
    background-repeat:no-repeat;
    cursor:pointer;
  }
  textarea::placeholder{color:var(--fg-faint);}
  textarea:focus, select:focus, input:focus{
    outline:2px solid var(--fg);
    outline-offset:1px;
  }
  .row{display:flex; gap:16px;}
  .row .field{flex:1;}
  .slider-row{display:flex; align-items:center; gap:14px;}
  input[type="range"]{
    flex:1;
    accent-color:var(--fg);
    height:2px;
  }
  .size-val{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    min-width:56px;
    text-align:right;
    color:var(--fg-soft);
  }
  .swatch-field{display:flex; align-items:center; gap:12px;}
  input[type="color"]{
    -webkit-appearance:none;
    appearance:none;
    width:44px;
    height:44px;
    border:1px solid var(--fg-faint);
    border-radius:var(--radius);
    padding:0;
    cursor:pointer;
    background:none;
  }
  input[type="color"]::-webkit-color-swatch-wrapper{padding:0;}
  input[type="color"]::-webkit-color-swatch{border:none;}
  .hex{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    color:var(--fg-soft);
  }

  /* ---- proof card ---- */
  .proof-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }
  .proof-card{
    position:relative;
    background:var(--bg-elev);
    border:1px solid var(--fg-faint);
    padding:36px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }
  .corner{
    position:absolute;
    width:16px;
    height:16px;
    border:1.5px solid var(--fg);
  }
  .corner.tl{top:10px; left:10px; border-right:none; border-bottom:none;}
  .corner.tr{top:10px; right:10px; border-left:none; border-bottom:none;}
  .corner.bl{bottom:10px; left:10px; border-right:none; border-top:none;}
  .corner.br{bottom:10px; right:10px; border-left:none; border-top:none;}
  #qrcode{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:120px;
  }
  #qrcode img, #qrcode canvas{
    display:block;
    max-width:100%;
    height:auto;
    border-radius:1px;
  }
  #qrcode.pop{
    animation:popIn 0.35s cubic-bezier(.22,.68,.32,1);
  }
  @keyframes popIn{
    from{opacity:0; transform:scale(0.9);}
    to{opacity:1; transform:scale(1);}
  }
  @media (prefers-reduced-motion: reduce){
    #qrcode.pop{animation:none;}
  }
  .empty-state{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    color:var(--fg-faint);
    text-align:center;
    line-height:1.6;
    padding:20px 10px;
  }
  .proof-footer{
    width:100%;
    padding-top:16px;
    border-top:1px dashed var(--fg-faint);
    display:flex;
    justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--fg-soft);
  }
  button#downloadBtn{
    width:100%;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:15px;
    color:var(--bg);
    background:var(--fg);
    border:none;
    border-radius:var(--radius);
    padding:15px 20px;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  button#downloadBtn:hover:not(:disabled){
    transform:translateY(-2px);
  }
  button#downloadBtn:active:not(:disabled){
    transform:translateY(0);
  }
  button#downloadBtn:disabled{
    background:var(--fg-faint);
    color:var(--bg-elev);
    cursor:not-allowed;
  }
  button#downloadBtn:focus-visible{
    outline:2px solid var(--fg);
    outline-offset:3px;
  }
  @media (prefers-reduced-motion: reduce){
    button#downloadBtn{transition:none;}
  }
</style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="spec-row">
        <span>QR / GENERATOR</span>
        <span id="dateStamp"></span>
      </div>
      <h1 class="headline">QR Generator </h1>
      <div class="bar"></div>
      <p class="tagline">Maximize Your Potential</p>
    </header>

    <main class="workspace">
      <section class="controls">
        <div class="field">
          <label for="textInput">인코딩할 텍스트 또는 URL</label>
          <textarea id="textInput" placeholder="https://example.com 또는 원하는 문구를 입력하세요"></textarea>
        </div>

        <div class="field">
          <label for="sizeRange">크기</label>
          <div class="slider-row">
            <input type="range" id="sizeRange" min="128" max="512" step="8" value="256">
            <span class="size-val" id="sizeVal">256px</span>
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="fgColor">코드 색상</label>
            <div class="swatch-field">
              <input type="color" id="fgColor" value="#16181c">
              <span class="hex" id="fgHex">#16181C</span>
            </div>
          </div>
          <div class="field">
            <label for="bgColor">배경 색상</label>
            <div class="swatch-field">
              <input type="color" id="bgColor" value="#fbfaf6">
              <span class="hex" id="bgHex">#FBFAF6</span>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="errorLevel">오류 정정 레벨</label>
          <select id="errorLevel">
            <option value="L">L — 낮음 (7% 복원)</option>
            <option value="M" selected>M — 보통 (15% 복원)</option>
            <option value="Q">Q — 높음 (25% 복원)</option>
            <option value="H">H — 최고 (30% 복원)</option>
          </select>
        </div>
      </section>

      <section class="proof-wrap">
        <div class="proof-card">
          <div class="corner tl"></div>
          <div class="corner tr"></div>
          <div class="corner bl"></div>
          <div class="corner br"></div>
          <div id="qrcode"></div>
          <div class="proof-footer">
            <span id="footSize">256 × 256</span>
            <span id="footLevel">EC: M</span>
          </div>
        </div>
        <button id="downloadBtn" disabled>PNG로 다운로드</button>
      </section>
    </main>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  const textInput = document.getElementById('textInput');
  const sizeRange = document.getElementById('sizeRange');
  const sizeVal = document.getElementById('sizeVal');
  const fgColor = document.getElementById('fgColor');
  const bgColor = document.getElementById('bgColor');
  const fgHex = document.getElementById('fgHex');
  const bgHex = document.getElementById('bgHex');
  const errorLevel = document.getElementById('errorLevel');
  const qrDiv = document.getElementById('qrcode');
  const downloadBtn = document.getElementById('downloadBtn');
  const footSize = document.getElementById('footSize');
  const footLevel = document.getElementById('footLevel');
  const dateStamp = document.getElementById('dateStamp');

  dateStamp.textContent = new Date().toISOString().slice(0,10).replace(/-/g,'.');

  const levelMap = { L: QRCode.CorrectLevel.L, M: QRCode.CorrectLevel.M, Q: QRCode.CorrectLevel.Q, H: QRCode.CorrectLevel.H };
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function showEmptyState(){
    qrDiv.classList.remove('pop');
    qrDiv.innerHTML = '<div class="empty-state">텍스트를 입력하면<br>여기에 QR 코드가 나타납니다</div>';
    downloadBtn.disabled = true;
  }

  function renderQR(){
    const text = textInput.value.trim();
    const size = parseInt(sizeRange.value, 10);
    sizeVal.textContent = size + 'px';
    footSize.textContent = size + ' × ' + size;
    footLevel.textContent = 'EC: ' + errorLevel.value;
    fgHex.textContent = fgColor.value.toUpperCase();
    bgHex.textContent = bgColor.value.toUpperCase();

    if(!text){
      showEmptyState();
      return;
    }

    qrDiv.innerHTML = '';
    new QRCode(qrDiv, {
      text: text,
      width: size,
      height: size,
      colorDark: fgColor.value,
      colorLight: bgColor.value,
      correctLevel: levelMap[errorLevel.value]
    });
    downloadBtn.disabled = false;

    if(!reduceMotion){
      qrDiv.classList.remove('pop');
      void qrDiv.offsetWidth; /* restart animation */
      qrDiv.classList.add('pop');
    }
  }

  [textInput, sizeRange, fgColor, bgColor, errorLevel].forEach(el => {
    el.addEventListener('input', renderQR);
  });

  downloadBtn.addEventListener('click', () => {
    const canvas = qrDiv.querySelector('canvas');
    if(!canvas) return;
    const link = document.createElement('a');
    link.download = 'qrcode.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  showEmptyState();
</script>
</body>
</html>
